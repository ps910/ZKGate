<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#121226"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Window Container with Shadow -->
  <rect x="20" y="20" width="860" height="460" rx="14" fill="url(#termGrad)" stroke="#2d2d5e" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Terminal Header Bar -->
  <rect x="20" y="20" width="860" height="42" rx="14" fill="#181832"/>
  <rect x="20" y="50" width="860" height="12" fill="#181832"/>
  <line x1="20" y1="62" x2="880" y2="62" stroke="#2d2d5e" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="48" cy="41" r="6.5" fill="#ff5f56"/>
  <circle cx="68" cy="41" r="6.5" fill="#ffbd2e"/>
  <circle cx="88" cy="41" r="6.5" fill="#27c93f"/>

  <!-- Title -->
  <text x="450" y="46" fill="#8888b0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="500" text-anchor="middle">terminal — npm test (vitest v2.1.9) — 20 tests passing</text>

  <!-- Terminal Body Content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="12" line-height="1.5">
    <text x="45" y="94" fill="#7c5cfc" font-weight="700">❯</text>
    <text x="65" y="94" fill="#e2e8f0" font-weight="600">npm test</text>
    <text x="45" y="118" fill="#64748b">> shroudwar-midnight@1.0.0 test</text>
    <text x="45" y="136" fill="#64748b">> vitest run --run</text>

    <!-- Run Header -->
    <rect x="45" y="152" width="46" height="18" rx="4" fill="#3b82f6"/>
    <text x="52" y="165" fill="#ffffff" font-weight="700" font-size="10">RUN</text>
    <text x="100" y="165" fill="#94a3b8" font-size="11">v2.1.9 C:/Users/pramo/Pictures/steller moon midnight</text>

    <!-- Test File 1 -->
    <text x="45" y="194" fill="#10b981" font-weight="bold">✓</text>
    <text x="65" y="194" fill="#f1f5f9" font-weight="600">src/test/contract.test.ts</text>
    <text x="350" y="194" fill="#64748b">(6 tests)</text>
    <text x="440" y="194" fill="#10b981">13ms</text>

    <!-- Test File 2 -->
    <text x="45" y="218" fill="#10b981" font-weight="bold">✓</text>
    <text x="65" y="218" fill="#f1f5f9" font-weight="600">src/test/shroudwar.simulator.test.ts</text>
    <text x="350" y="218" fill="#64748b">(9 tests)</text>
    <text x="440" y="218" fill="#10b981">16ms</text>

    <text x="75" y="238" fill="#10b981">✓</text>
    <text x="95" y="238" fill="#94a3b8">initializes game parameters matching specification</text>
    <text x="75" y="256" fill="#10b981">✓</text>
    <text x="95" y="256" fill="#94a3b8">registers private positions and produces distinct commitments</text>
    <text x="75" y="274" fill="#10b981">✓</text>
    <text x="95" y="274" fill="#94a3b8">approves legal Chebyshev moves within moveSpeed &lt;= 2</text>
    <text x="75" y="292" fill="#10b981">✓</text>
