    <text x="75" y="310" fill="#10b981">✓</text>
    <text x="95" y="310" fill="#94a3b8">rotates salt on every move ensuring unlinkability</text>
    <text x="75" y="328" fill="#10b981">✓</text>
    <text x="95" y="328" fill="#94a3b8">discloses ONLY binary boolean on scout and never coordinates</text>
    <text x="75" y="346" fill="#10b981">✓</text>
    <text x="95" y="346" fill="#94a3b8">detects adjacent and diagonal combat within range &lt;= 1</text>
    <text x="75" y="364" fill="#10b981">✓</text>
    <text x="95" y="364" fill="#94a3b8">declares winner when all opposing units are eliminated</text>

    <!-- Test File 3 -->
    <text x="45" y="394" fill="#10b981" font-weight="bold">✓</text>
    <text x="65" y="394" fill="#f1f5f9" font-weight="600">src/test/app.test.tsx</text>
    <text x="350" y="394" fill="#64748b">(5 tests)</text>
    <text x="440" y="394" fill="#10b981">318ms</text>

    <text x="75" y="414" fill="#10b981">✓</text>
    <text x="95" y="414" fill="#94a3b8">renders ShroudWar title, board grid, tactical panel, and privacy model</text>
  </g>

  <!-- Summary Box -->
  <rect x="540" y="190" width="315" height="180" rx="8" fill="#161630" stroke="#333366" stroke-width="1"/>
  <text x="560" y="224" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Test Files</text>
  <text x="680" y="224" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">3 passed (3)</text>

  <text x="560" y="254" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Tests</text>
  <text x="680" y="254" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">20 passed (20)</text>

  <text x="560" y="284" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Duration</text>
  <text x="680" y="284" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">3.29s</text>

  <rect x="560" y="310" width="275" height="28" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
  <text x="697" y="328" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">✔ ALL 20 TESTS PASSED</text>
</svg>
