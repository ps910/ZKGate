    <text x="45" y="248" fill="#94a3b8">  Node RPC URL:      https://rpc.preprod.midnight.network</text>
    <text x="45" y="270" fill="#94a3b8">  Proof Server URL:  http://localhost:6300 (Preprod keys)</text>

    <text x="45" y="304" fill="#06b6d4">⚡ Compiling shroudwar.compact circuits &amp; proving keys...</text>
    <text x="45" y="326" fill="#06b6d4">   Circuits: initGame, registerUnit, move, requestScout, respondScout, claimCombat</text>

