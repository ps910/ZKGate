<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070712"/>
      <stop offset="50%" stop-color="#0d0d20"/>
      <stop offset="100%" stop-color="#090916"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cfc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16162e"/>
      <stop offset="100%" stop-color="#101024"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0f0f24" stroke="#25254a" stroke-width="1"/>
  <circle cx="45" cy="35" r="18" fill="url(#accentGrad)"/>
  <text x="45" y="41" fill="#ffffff" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🌌</text>
  <text x="75" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-size="20" font-weight="800">ShroudWar</text>
  <text x="75" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">ON-CHAIN FOG-OF-WAR · LEVEL 4</text>

  <rect x="290" y="24" width="150" height="24" rx="12" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="0.8"/>
  <circle cx="304" cy="36" r="4" fill="#10b981"/>
  <text x="375" y="40" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">MIDNIGHT PREPROD</text>

  <rect x="740" y="20" width="220" height="32" rx="6" fill="#181834" stroke="#2d2d5a" stroke-width="1"/>
  <text x="752" y="40" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Circuit: 0x8b3f...5d4c</text>

  <rect x="980" y="18" width="180" height="34" rx="8" fill="url(#accentGrad)"/>
  <text x="1070" y="40" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">0x3f2a...4f3a (Lace)</text>

  <!-- Left Side: 10x10 Fog of War Grid -->
  <rect x="40" y="90" width="550" height="520" rx="12" fill="url(#cardGrad)" stroke="#272750" stroke-width="1.2"/>
  <text x="65" y="122" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">🌌 10x10 Fog-of-War Grid</text>
  <text x="320" y="122" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11">Preprod Circuit: 0x8b3f...5d4c</text>

  <!-- Legend -->
  <circle cx="68" cy="142" r="4" fill="#3b82f6"/>
  <text x="78" y="146" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Own Unit (Shielded)</text>
  <circle cx="188" cy="142" r="4" fill="#ef4444"/>
  <text x="198" y="146" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Radar Ping</text>
  <circle cx="280" cy="142" r="4" fill="#10b981"/>
  <text x="290" y="146" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Scouted Clear</text>
  <circle cx="380" cy="142" r="4" fill="#334155"/>
  <text x="390" y="146" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Deep Fog</text>

  <!-- Grid Preview Representation -->
  <rect x="65" y="160" width="500" height="430" rx="8" fill="#090918" stroke="#222244" stroke-width="1"/>
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">
    <!-- Grid Cells Background -->
    <rect x="80" y="175" width="46" height="40" rx="3" fill="#13132a" stroke="#232348"/>
    <text x="85" y="190" font-size="8" fill="#334155">1,1</text>
    <text x="96" y="202" font-size="14">🛡️</text>

    <rect x="130" y="175" width="46" height="40" rx="3" fill="#13132a" stroke="#232348"/>
    <text x="135" y="190" font-size="8" fill="#334155">2,1</text>
    <text x="148" y="200" font-size="12" fill="#3b82f6">✦</text>

    <rect x="180" y="175" width="46" height="40" rx="3" fill="#13132a" stroke="#232348"/>
    <text x="185" y="190" font-size="8" fill="#334155">3,1</text>
    <text x="198" y="200" font-size="12" fill="#3b82f6">✦</text>

    <rect x="80" y="220" width="46" height="40" rx="3" fill="#13132a" stroke="#232348"/>
    <text x="85" y="235" font-size="8" fill="#334155">1,2</text>
    <text x="98" y="245" font-size="12" fill="#3b82f6">✦</text>

    <rect x="130" y="220" width="46" height="40" rx="3" fill="#1d1d42" stroke="#7c5cfc" stroke-width="1.5"/>
    <text x="135" y="235" font-size="8" fill="#a78bfa">2,2</text>
    <text x="146" y="247" font-size="14">🛡️</text>

    <!-- Radar Scout Cell -->
    <rect x="380" y="445" width="46" height="40" rx="3" fill="#301520" stroke="#ef4444" stroke-width="1.5"/>
    <text x="385" y="460" font-size="8" fill="#ef4444">7,7</text>
    <text x="395" y="472" font-size="14">📡</text>

    <!-- Clear Cell -->
    <rect x="280" y="355" width="46" height="40" rx="3" fill="#102620" stroke="#10b981"/>
    <text x="285" y="370" font-size="8" fill="#10b981">5,5</text>
    <text x="300" y="380" font-size="16" fill="#10b981">·</text>
  </g>

  <!-- Right Side: Tactical Command Center -->
  <rect x="610" y="90" width="550" height="340" rx="12" fill="url(#cardGrad)" stroke="#272750" stroke-width="1.2"/>
  <text x="635" y="122" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">⚡ Tactical Command Center</text>
  <rect x="990" y="106" width="150" height="22" rx="4" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="1065" y="121" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Window: 3 Actions</text>

  <!-- Action 1: ZK Move -->
  <rect x="635" y="140" width="500" height="70" rx="8" fill="#121226" stroke="#25254a" stroke-width="1"/>
  <text x="655" y="162" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">🚀 1. ZK Move (Chebyshev &le; 2)</text>
  <text x="655" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Move unit_a_0 to (2, 3) — Proves Chebyshev legality without disclosing coordinates.</text>
  <rect x="1000" y="152" width="120" height="28" rx="6" fill="url(#accentGrad)"/>
  <text x="1060" y="170" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Prove Move</text>

  <!-- Action 2: Scout -->
  <rect x="635" y="220" width="500" height="65" rx="8" fill="#121226" stroke="#25254a" stroke-width="1"/>
  <text x="655" y="242" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">📡 2. Scout Cell (Disclose Boolean Only)</text>
  <text x="655" y="260" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Query cell (7, 7) — Opponent must disclose only boolean (occupied/not).</text>
  <rect x="1000" y="232" width="120" height="28" rx="6" fill="#3b82f6"/>
  <text x="1060" y="250" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Scan Radar</text>

  <!-- Action 3: Combat Claim -->
  <rect x="635" y="295" width="500" height="65" rx="8" fill="#121226" stroke="#25254a" stroke-width="1"/>
  <text x="655" y="317" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700">⚔️ 3. Claim Combat (Range &le; 1)</text>
  <text x="655" y="335" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Target unit_b_0 at (7, 7) — Proximity trigger enforces mutual destruction.</text>
  <rect x="1000" y="307" width="120" height="28" rx="6" fill="#ef4444"/>
  <text x="1060" y="325" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Engage Combat</text>

  <!-- Right Side: Stats Row -->
  <rect x="610" y="445" width="550" height="80" rx="10" fill="url(#cardGrad)" stroke="#272750"/>
  <text x="670" y="475" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Player A (You)</text>
  <text x="670" y="505" fill="#10b981" font-family="'Inter', sans-serif" font-size="18" font-weight="800">4 / 4 Alive</text>

  <text x="800" y="475" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Player B (Opponent)</text>
  <text x="800" y="505" fill="#06b6d4" font-family="'Inter', sans-serif" font-size="18" font-weight="800">3 / 4 Alive</text>

  <text x="960" y="475" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Action Counter</text>
  <text x="960" y="505" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="18" font-weight="800">#15</text>

  <text x="1070" y="475" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Phase</text>
  <text x="1070" y="505" fill="#f472b6" font-family="'Inter', sans-serif" font-size="18" font-weight="800">ACTIVE</text>

  <!-- Bottom: Privacy Model Matrix -->
  <rect x="40" y="625" width="1120" height="150" rx="12" fill="#111124" stroke="#25254a"/>
  <text x="65" y="655" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="700">🛡️ Midnight Privacy Model: ShroudWar vs Dark Forest</text>

  <rect x="65" y="670" width="530" height="90" rx="6" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="0.7"/>
  <text x="80" y="690" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">PUBLIC LEDGER STATE (ON-CHAIN)</text>
  <text x="80" y="710" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• unitCommitments[unitId] (Poseidon/SHA-256 hash) • unitAlive (Boolean)</text>
  <text x="80" y="728" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Scout challenge target &amp; disclosed boolean only (occupied: Boolean)</text>
  <text x="80" y="746" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Global actionCount sequence clock &amp; mutual destruction combat events</text>

  <rect x="615" y="670" width="530" height="90" rx="6" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="0.7"/>
  <text x="630" y="690" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="11" font-weight="700">SHIELDED IN CLIENT WITNESS (NEVER LEAVES DEVICE)</text>
  <text x="630" y="710" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Exact unit coordinates Position &#123; x, y &#125; are stored in local IndexedDB</text>
  <text x="630" y="728" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Fresh 32-byte salt rotated on every single move (untraceable)</text>
  <text x="630" y="746" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• ZK-SNARK movement proof proves Chebyshev &le; 2 without showing coordinates</text>
</svg>
