    <text x="45" y="380" fill="#e2e8f0">  Contract Address: <tspan fill="#a78bfa">0x8b3f4c2e1a9d7e6c5b4a3f2e1d0c9b8a7f6e5d4c</tspan></text>
    <text x="45" y="402" fill="#e2e8f0">  Tx Hash:          <tspan fill="#64748b">0x9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b</tspan></text>
    <text x="45" y="424" fill="#e2e8f0">  Block Height:     <tspan fill="#10b981">#189,420</tspan> • Parameters: 10x10 Grid, Speed 2, Range 1, Window 3</text>
