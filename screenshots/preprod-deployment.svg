      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#121226"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="860" height="420" rx="14" fill="url(#termGrad)" stroke="#2d2d5e" stroke-width="1.5"/>
  <rect x="20" y="20" width="860" height="42" rx="14" fill="#181832"/>
  <rect x="20" y="50" width="860" height="12" fill="#181832"/>
  <line x1="20" y1="62" x2="880" y2="62" stroke="#2d2d5e" stroke-width="1"/>

  <circle cx="48" cy="41" r="6.5" fill="#ff5f56"/>
  <circle cx="68" cy="41" r="6.5" fill="#ffbd2e"/>
  <circle cx="88" cy="41" r="6.5" fill="#27c93f"/>

  <text x="450" y="46" fill="#8888b0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" text-anchor="middle">terminal — npm run deploy (ShroudWar on Midnight Preprod)</text>

  <g font-family="'JetBrains Mono', monospace" font-size="12.5" line-height="1.6">
    <text x="45" y="96" fill="#7c5cfc" font-weight="700">❯</text>
    <text x="65" y="96" fill="#e2e8f0" font-weight="600">npm run deploy</text>

    <text x="45" y="124" fill="#64748b">> shroudwar-midnight@1.0.0 deploy</text>
    <text x="45" y="144" fill="#64748b">> tsx scripts/deploy.ts</text>

    <text x="45" y="180" fill="#a78bfa" font-weight="700">🛡️  Deploying ShroudWar Contract to Midnight Preprod Network</text>
    <text x="45" y="204" fill="#94a3b8">  Network:           preprod</text>
