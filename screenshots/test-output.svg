<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#121226"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Window Container with Shadow -->
  <rect x="20" y="20" width="860" height="440" rx="14" fill="url(#termGrad)" stroke="#2d2d5e" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Terminal Header Bar -->
  <rect x="20" y="20" width="860" height="42" rx="14" fill="#181832"/>
  <rect x="20" y="50" width="860" height="12" fill="#181832"/>
  <line x1="20" y1="62" x2="880" y2="62" stroke="#2d2d5e" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="48" cy="41" r="6.5" fill="#ff5f56"/>
  <circle cx="68" cy="41" r="6.5" fill="#ffbd2e"/>
  <circle cx="88" cy="41" r="6.5" fill="#27c93f"/>

  <!-- Title -->
  <text x="450" y="46" fill="#8888b0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="500" text-anchor="middle">terminal — npm test (vitest v2.1.9) — 9 tests passing</text>

  <!-- Terminal Body Content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13" line-height="1.6">
    <!-- Command -->
    <text x="45" y="98" fill="#7c5cfc" font-weight="700">❯</text>
    <text x="65" y="98" fill="#e2e8f0" font-weight="600">npm test</text>

    <text x="45" y="128" fill="#64748b">> midnight-private-allowlist@1.0.0 test</text>
    <text x="45" y="148" fill="#64748b">> vitest run</text>

    <!-- Run Header -->
    <rect x="45" y="170" width="46" height="20" rx="4" fill="#3b82f6"/>
    <text x="52" y="184" fill="#ffffff" font-weight="700" font-size="11">RUN</text>
    <text x="100" y="185" fill="#94a3b8" font-size="12">v2.1.9 C:/Users/pramo/Pictures/steller moon midnight</text>

    <!-- Test File 1 -->
    <text x="45" y="222" fill="#10b981" font-weight="bold">✓</text>
    <text x="65" y="222" fill="#f1f5f9" font-weight="600">src/test/contract.test.ts</text>
    <text x="320" y="222" fill="#64748b">(6 tests)</text>
    <text x="400" y="222" fill="#10b981">9ms</text>

    <text x="75" y="244" fill="#10b981">✓</text>
    <text x="95" y="244" fill="#94a3b8">generates 32-byte member secrets</text>

    <text x="75" y="264" fill="#10b981">✓</text>
    <text x="95" y="264" fill="#94a3b8">derives deterministic commitment matching Compact specification</text>

    <text x="75" y="284" fill="#10b981">✓</text>
    <text x="95" y="284" fill="#94a3b8">generates distinct commitments for distinct secrets (collision resistance)</text>

    <text x="75" y="304" fill="#10b981">✓</text>
    <text x="95" y="304" fill="#94a3b8">generates unique nullifiers per proof session (unlinkability)</text>

    <text x="75" y="324" fill="#10b981">✓</text>
    <text x="95" y="324" fill="#94a3b8">prevents double-proof replay attacks with registered nullifiers</text>

    <text x="75" y="344" fill="#10b981">✓</text>
    <text x="95" y="344" fill="#94a3b8">validates allowlist capacity limit of 1000 members</text>

    <!-- Test File 2 -->
    <text x="45" y="374" fill="#10b981" font-weight="bold">✓</text>
    <text x="65" y="374" fill="#f1f5f9" font-weight="600">src/test/app.test.tsx</text>
    <text x="320" y="374" fill="#64748b">(3 tests)</text>
    <text x="400" y="374" fill="#10b981">78ms</text>

    <text x="75" y="394" fill="#10b981">✓</text>
    <text x="95" y="394" fill="#94a3b8">renders the application title and network status badge</text>

    <text x="75" y="414" fill="#10b981">✓</text>
    <text x="95" y="414" fill="#94a3b8">renders wallet connect, prover, and privacy model cards</text>

    <text x="75" y="434" fill="#10b981">✓</text>
    <text x="95" y="434" fill="#94a3b8">updates proof flow status upon proving membership</text>
  </g>

  <!-- Summary Box -->
  <rect x="530" y="210" width="325" height="150" rx="8" fill="#161630" stroke="#333366" stroke-width="1"/>
  <text x="550" y="240" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Test Files</text>
  <text x="660" y="240" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">2 passed (2)</text>

  <text x="550" y="270" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Tests</text>
  <text x="660" y="270" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">9 passed (9)</text>

  <text x="550" y="300" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Duration</text>
  <text x="660" y="300" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13">1.71s</text>

  <rect x="550" y="322" width="285" height="26" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
  <text x="692" y="339" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">✔ ALL 9 TESTS PASSED</text>
</svg>
